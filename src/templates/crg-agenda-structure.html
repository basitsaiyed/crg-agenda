<html>
<head>
<meta content="text/html; charset=UTF-8" http-equiv="content-type">
<style type="text/css">
  * { box-sizing: border-box; }
  body {
    background: #fff;
    color: #111;
    font-family: Arial, sans-serif;
    font-size: 9.5pt;
    margin: 0;
    padding: 10pt 14pt 14pt 14pt;
  }

  .theme-line {
    font-style: italic;
    margin: 0 0 8pt 0;
    color: #444;
    font-size: 9.5pt;
  }

  /* ── Agenda table ── */
  .agenda-table {
    width: 100%;
    border-collapse: collapse;
    /* auto so time column sizes to its content */
    table-layout: auto;
  }

  /* Header */
  .agenda-table thead tr th {
    padding: 3pt 6pt 4pt 6pt;
    font-size: 10pt;
    font-weight: 700;
    color: #1a5fa8;
    text-align: left;
    border-bottom: 2px solid #1a5fa8;
    white-space: nowrap;
  }
  .agenda-table thead tr th.th-time    { padding-right: 12pt; }
  .agenda-table thead tr th.th-program { width: 99%; }
  .agenda-table thead tr th.th-acct    { text-align: right; white-space: nowrap; }

  /* ── Segment rows shared ── */
  .seg-main td,
  .seg-sub  td {
    vertical-align: top;
    border: none;
    line-height: 1.4;
  }

  /* ── Main segment row ── */
  .seg-main td { padding: 4pt 6pt 0pt 6pt; }

  .seg-main .td-time {
    font-weight: 700;
    font-size: 9.5pt;
    white-space: nowrap;
    color: #111;
    padding-right: 12pt;
  }
  .seg-main .td-program {
    font-weight: 700;
    font-size: 9.5pt;
    color: #111;
  }
  .seg-main .td-acct {
    font-weight: 400;
    font-size: 9.5pt;
    text-align: right;
    white-space: nowrap;
    color: #111;
    padding-left: 8pt;
  }

  /* ── Sub-item row ── */
  .seg-sub td { padding: 1pt 6pt 0pt 6pt; }

  .seg-sub .td-time {
    font-size: 9.5pt;
    white-space: nowrap;
    padding-right: 12pt;
  }
  .seg-sub .td-program {
    font-weight: 400;
    font-size: 9.5pt;
    color: #333;
    padding-left: 16pt;
  }
  .seg-sub .td-acct {
    font-weight: 400;
    font-size: 9.5pt;
    text-align: right;
    white-space: nowrap;
    color: #333;
    padding-left: 8pt;
  }

  /* Spacer between section groups */
  .seg-gap td {
    height: 6pt;
    border: none;
    padding: 0;
  }

  @media print {
    body { padding: 8pt 12pt !important; }
  }
</style>
</head>
<body class="doc-content">

{{THEME_SECTION}}

<table class="agenda-table">
  <tbody>
    {{AGENDA_ROWS}}
  </tbody>
</table>

</body>
</html>
