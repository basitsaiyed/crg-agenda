<html>
<head>
<meta content="text/html; charset=UTF-8" http-equiv="content-type">
<style type="text/css">
  * { box-sizing: border-box; }
  body {
    background: #fff;
    color: #111;
    font-family: Arial, sans-serif;
    font-size: 11pt;
    margin: 0;
    padding: 10pt 14pt 14pt 14pt;
  }

  .theme-line {
    font-style: italic;
    margin: 0 0 8pt 0;
    color: #444;
    font-size: 11pt;
  }

  /* ── Agenda table ── */
  .agenda-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  /* Fixed column widths via colgroup */
  .col-time { width: 95px; }
  .col-prog { /* fills remaining space */ }
  .col-acct { width: 130px; }

  /* ── Shared row styles ── */
  .seg-main td,
  .seg-sub td {
    vertical-align: top;
    border: none;
    line-height: 1.4;
    padding: 0 4pt 0 0;
  }

  /* ── Main heading row ── */
  .seg-main td { padding-top: 4pt; }

  .seg-main .td-time {
    font-weight: 700;
    font-size: 11pt;
    color: #111;
    padding-right: 8pt;
    white-space: nowrap;
    overflow: hidden;
  }
  .seg-main .td-program {
    font-weight: 700;
    font-size: 11pt;
    color: #111;
    word-wrap: break-word;
  }
  .seg-main .td-acct {
    font-weight: 400;
    font-size: 11pt;
    text-align: right;
    color: #111;
    word-wrap: break-word;
  }

  /* ── Sub-item row ── */
  .seg-sub .td-time {
    font-size: 11pt;
  }
  .seg-sub .td-program {
    font-weight: 400;
    font-size: 11pt;
    color: #333;
    padding-left: 12pt;
    word-wrap: break-word;
  }
  .seg-sub .td-acct {
    font-weight: 400;
    font-size: 11pt;
    text-align: right;
    color: #333;
    word-wrap: break-word;
  }

  /* Gap between sections */
  .seg-gap td {
    height: 6pt;
    border: none;
    padding: 0;
  }

  @media print {
    body { padding: 8pt 12pt !important; }
  }
</style>
</head>
<body class="doc-content">

{{THEME_SECTION}}

<table class="agenda-table">
  <colgroup>
    <col class="col-time" />
    <col class="col-prog" />
    <col class="col-acct" />
  </colgroup>
  <tbody>
    {{AGENDA_ROWS}}
  </tbody>
</table>

</body>
</html>
