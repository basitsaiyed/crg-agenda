<html>
<head>
<meta content="text/html; charset=UTF-8" http-equiv="content-type">
<style type="text/css">
  * { box-sizing: border-box; }
  body {
    background: #fff;
    color: #111;
    font-family: Arial, sans-serif;
    font-size: 9.5pt;
    margin: 0;
    padding: 10pt 14pt 14pt 14pt;
  }

  .theme-line {
    font-style: italic;
    margin: 0 0 8pt 0;
    color: #444;
    font-size: 9.5pt;
  }

  /* ── Agenda table ── */
  .agenda-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  /* Header */
  .agenda-table thead tr th {
    padding: 3pt 4pt 4pt 4pt;
    font-size: 10pt;
    font-weight: 700;
    color: #1a5fa8;
    text-align: left;
    border-bottom: 2px solid #1a5fa8;
    border-top: 2px solid #1a5fa8;
  }
  .agenda-table thead tr th.th-time     { width: 115px; }
  .agenda-table thead tr th.th-program  { }
  .agenda-table thead tr th.th-acct     { width: 130px; text-align: right; }

  /* ── Main segment row ── */
  .seg-main td {
    padding: 5pt 4pt 1pt 4pt;
    vertical-align: top;
    border: none;
    line-height: 1.3;
  }
  .seg-main .td-time {
    font-weight: 700;
    font-size: 9.5pt;
    white-space: nowrap;
    color: #111;
    /* time column for main rows */
  }
  .seg-main .td-program {
    font-weight: 700;
    font-size: 9.5pt;
    color: #111;
  }
  .seg-main .td-acct {
    font-weight: 400;
    font-size: 9.5pt;
    text-align: right;
    white-space: nowrap;
    color: #111;
  }

  /* ── Sub-item row ── */
  .seg-sub td {
    padding: 1pt 4pt 1pt 4pt;
    vertical-align: top;
    border: none;
    line-height: 1.3;
  }
  .seg-sub .td-time {
    /* empty — no time shown for sub-rows */
    font-size: 9.5pt;
  }
  .seg-sub .td-program {
    font-weight: 400;
    font-size: 9.5pt;
    color: #333;
    padding-left: 14pt;
  }
  .seg-sub .td-acct {
    font-weight: 400;
    font-size: 9.5pt;
    text-align: right;
    white-space: nowrap;
    color: #333;
  }

  /* Spacer between groups */
  .seg-gap td {
    padding: 3pt 0 0 0;
    height: 3pt;
    border: none;
  }

  @media print {
    body { padding: 8pt 12pt !important; }
  }
</style>
</head>
<body class="doc-content">

{{THEME_SECTION}}

<table class="agenda-table">
  <thead>
    <tr>
      <th class="th-time">Time</th>
      <th class="th-program">Program</th>
      <th class="th-acct">Accountability</th>
    </tr>
  </thead>
  <tbody>
    {{AGENDA_ROWS}}
  </tbody>
</table>

</body>
</html>
